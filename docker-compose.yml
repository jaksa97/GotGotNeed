services:
  mysql:
    image: mysql:8.4
    container_name: gotgotneed-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gotgotneed}
      MYSQL_USER: ${MYSQL_USER:-gotgotneed}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-gotgotneed}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-gotgotneed}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      # Named, persistent volume so data survives `docker compose down` (but not `down -v`).
      - gotgotneed-mysql-data:/var/lib/mysql
      # Scripts placed here run once, only against a brand-new (empty) data volume.
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - gotgotneed-network

  backend:
    build:
      # Build context is the repo root (not ./backend) because this is a
      # single Gradle multi-module monorepo — see backend/Dockerfile's
      # header comment for why the whole repo is needed to build :backend.
      context: .
      dockerfile: backend/Dockerfile
    image: gotgotneed-backend:latest
    container_name: gotgotneed-backend
    restart: unless-stopped
    environment:
      # DB_HOST/DB_PORT describe the Compose network topology: the "mysql"
      # service is always reachable by that name on its container-internal
      # port 3306, regardless of what host port MYSQL_PORT maps it to. Only
      # the credentials/database name come from .env, and must match the
      # MYSQL_* values above (they seed the actual MySQL user/database).
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-gotgotneed}
      DB_USERNAME: ${DB_USERNAME:-gotgotneed}
      DB_PASSWORD: ${DB_PASSWORD:-gotgotneed}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      # Wait for MySQL to report "healthy" (accepting connections), not just
      # "started" — otherwise the backend can race MySQL's own startup.
      mysql:
        condition: service_healthy
    networks:
      - gotgotneed-network

networks:
  gotgotneed-network:
    name: gotgotneed-network

volumes:
  gotgotneed-mysql-data:
    name: gotgotneed-mysql-data
