services:
  mysql:
    image: mysql:8.4
    container_name: gotgotneed-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gotgotneed}
      MYSQL_USER: ${MYSQL_USER:-gotgotneed}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-gotgotneed}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-gotgotneed}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      # Named, persistent volume so data survives `docker compose down` (but not `down -v`).
      - gotgotneed-mysql-data:/var/lib/mysql
      # Scripts placed here run once, only against a brand-new (empty) data volume.
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  gotgotneed-mysql-data:
    name: gotgotneed-mysql-data
